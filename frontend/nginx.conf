server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photos from phones can be large; the API accepts up to 15 MB.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Recognition runs synchronously and can take tens of seconds.
    # Resolved per request through Docker's DNS, so nginx still starts if the backend is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    # The service worker and its manifest must never be served stale, or updates never arrive.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fingerprinted build output is immutable.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routes such as /scan/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Behind a TLS-terminating tunnel (tailscale serve, cloudflared) the tunnel sets X-Forwarded-Proto
# and this nginx sees plain HTTP: pass the original scheme through. Otherwise use our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $forwarded_proto $default_port {
    https   443;
    default 80;
}

# Port as seen by the browser: taken from Host (nginx itself listens on 80 inside the container).
map $http_host $forwarded_port {
    ~:(?<p>\d+)$ $p;
    default     $default_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Photos from phones can be large; the API accepts up to 15 MB.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Recognition runs synchronously and can take tens of seconds.
    # Resolved per request through Docker's DNS, so nginx still starts if the backend is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # $http_host keeps the port (4200); $host would drop it and break Spring's same-origin check.
        # Forwarded headers are OVERWRITTEN, never appended to client-supplied values (ADR 0008).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    # The service worker and its manifest must never be served stale, or updates never arrive.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fingerprinted build output is immutable.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routes such as /scan/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

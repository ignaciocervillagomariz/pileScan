spring.application.name=pilescan-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pilescan}
spring.datasource.username=${DB_USER:pilescan}
spring.datasource.password=${DB_PASSWORD:pilescan}
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Behind nginx (or a tunnel in front of it): honour X-Forwarded-* so generated URLs and schemes are right.
server.forward-headers-strategy=framework
spring.jackson.default-property-inclusion=always

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

pilescan.scan.storage-dir=${SCAN_STORAGE_DIR:./data/scans}
pilescan.inference.url=${INFERENCE_URL:http://localhost:8000}
pilescan.inference.timeout=${INFERENCE_TIMEOUT_SECONDS:120}s
pilescan.catalog.import-on-startup=${CATALOG_IMPORT_ON_STARTUP:false}
pilescan.catalog.base-url=${CATALOG_BASE_URL:https://cdn.rebrickable.com/media/downloads}
pilescan.catalog.cache-dir=${CATALOG_CACHE_DIR:./data/catalog}
pilescan.catalog.max-age=${CATALOG_MAX_AGE_DAYS:30}d
pilescan.rebrickable.api-url=${REBRICKABLE_API_URL:https://rebrickable.com}
pilescan.rebrickable.api-key=${REBRICKABLE_API_KEY:}
pilescan.rebrickable.min-interval=${REBRICKABLE_MIN_INTERVAL_MS:1100}ms

[project]
name = "pilescan-eval"
version = "0.1.0"
description = "PileScan evaluation harness: runs real and synthetic photos through inference and the public API and computes metrics"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pillow>=11.3",   # native AVIF/WebP decoding
]

[project.scripts]
pilescan-eval = "pilescan_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilescan_eval"]

[dependency-groups]
dev = ["pytest>=8"]
